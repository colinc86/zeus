name: Zeus
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: '26.0'
packages:
  ZeusKit:
    path: Packages/ZeusKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
  configs:
    Release:
      # scripts/release.sh supplies the exact identity and team from scripts/release.local.env.
      CODE_SIGN_IDENTITY: 'Developer ID Application'
      OTHER_CODE_SIGN_FLAGS: '--timestamp'
targets:
  Zeus:
    type: application
    platform: macOS
    sources:
      - path: Zeus
        excludes: ['App/Tests', 'App/UpdateInfo.plist']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colinc86.Zeus
        CODE_SIGN_ENTITLEMENTS: Zeus/App/Zeus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Zeus/App/UpdateInfo.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Zeus reads the current browser address or Mail subject only when you enable window and document learning.
        INFOPLIST_KEY_CFBundleDisplayName: Zeus
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: 0.2.8
        CURRENT_PROJECT_VERSION: 21
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ARCHS: 'arm64 x86_64'
          ONLY_ACTIVE_ARCH: NO
    dependencies:
      - package: ZeusKit
        product: ZeusProtocol
      - package: ZeusKit
        product: ZeusLink
      - package: ZeusKit
        product: ZeusSprites
      - package: ZeusKit
        product: ZeusDesign
      - package: Sparkle
        product: Sparkle
        codeSign: true
    postBuildScripts:
      - name: Build and embed zeus-mcp
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          BRIDGE_BUILD_DIR="$SRCROOT/build/EmbeddedBridge/$CONFIGURATION"
          BRIDGE_CONFIG="debug"
          set --
          if [ "$CONFIGURATION" = "Release" ]; then
            BRIDGE_CONFIG="release"
            BRIDGE_BUILD_DIR="$SRCROOT/build/release/EmbeddedBridge"
            for BRIDGE_ARCH in $ARCHS; do set -- "$@" --arch "$BRIDGE_ARCH"; done
          fi
          /usr/bin/xcrun swift build --package-path "$SRCROOT/Packages/ZeusKit" --scratch-path "$BRIDGE_BUILD_DIR" --configuration "$BRIDGE_CONFIG" "$@" --product zeus-mcp
          BRIDGE_BIN_DIR=$(/usr/bin/xcrun swift build --package-path "$SRCROOT/Packages/ZeusKit" --scratch-path "$BRIDGE_BUILD_DIR" --configuration "$BRIDGE_CONFIG" "$@" --show-bin-path)
          /usr/bin/install -m 755 "$BRIDGE_BIN_DIR/zeus-mcp" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/zeus-mcp"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            : # Unsigned compilation checks must not access signing identities.
          elif [ "$CONFIGURATION" = "Release" ]; then
            /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/zeus-mcp"
          else
            /usr/bin/codesign --force --sign - "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/zeus-mcp"
          fi
      - name: Sign Sparkle release helpers
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework
        script: |
          set -euo pipefail
          if [ "$CONFIGURATION" != "Release" ] || [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then exit 0; fi
          ZEUS_SPARKLE_FRAMEWORK="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          ZEUS_SPARKLE_VERSION="$ZEUS_SPARKLE_FRAMEWORK/Versions/Current"
          # Xcode's Code Sign on Copy seals the framework, but our build (not archive/export)
          # release pipeline must also sign its nested code, from the inside out.
          /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$ZEUS_SPARKLE_VERSION/XPCServices/Installer.xpc"
          /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp --preserve-metadata=entitlements "$ZEUS_SPARKLE_VERSION/XPCServices/Downloader.xpc"
          /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$ZEUS_SPARKLE_VERSION/Autoupdate"
          /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$ZEUS_SPARKLE_VERSION/Updater.app"
          /usr/bin/codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$ZEUS_SPARKLE_FRAMEWORK"
  ZeusTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Zeus/App/Tests]
    dependencies:
      - target: Zeus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colinc86.ZeusTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Zeus:
    build:
      targets:
        Zeus: all
        ZeusTests: [test]
    test:
      targets: [ZeusTests]
